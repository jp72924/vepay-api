[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vepay-api"
version = "0.1.0"
description = "HTTP API and CLI for extracting structured data from Venezuelan mobile payment receipt screenshots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "VEPay API contributors" }
]
keywords = ["ocr", "tesseract", "venezuela", "payments", "receipts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing"
]
dependencies = [
  "fastapi>=0.110",
  "pillow>=10",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "jsonschema>=4",
  "pytest>=8"
]

[project.scripts]
vepay-api = "vepay_api:main"
vepay-api-cli = "vepay_api_core:main"

[tool.setuptools]
py-modules = ["vepay_api_core", "vepay_api", "vepayocr", "vepayocr_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
