# Non-secret runtime configuration for Cloud Run.
# VEPAY_API_KEY is intentionally stored in Secret Manager by the deploy scripts.
VEPAY_API_MAX_FILES: "10"
VEPAY_API_MAX_JOB_FILES: "100"
VEPAY_API_MAX_FILE_SIZE_BYTES: "10485760"
VEPAY_API_MAX_CONCURRENCY: "2"
VEPAY_API_JOB_TTL_SECONDS: "3600"
VEPAY_API_ENABLE_UI: "true"
VEPAY_API_UI_DEFAULT_ROUTE: "false"
VEPAY_API_REQUIRE_API_KEY: "true"
